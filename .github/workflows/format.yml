name: format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    name: prettier --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # CI は 22 系の最新パッチに追従する（Renovate が更新する）。
          # 最低要件は package.json の engines（>=22.13.0）。
          # @commitlint/* が >=22.12.0、ESLint v10 が ^20.19.0 || ^22.13.0 || >=24 の
          # ため、22 系で両方を満たす下限は 22.13。
          node-version: '22.23'
          cache: 'npm'

      - name: Install dependencies
        # フォーマット検査は postinstall を必要としない
        run: npm ci --ignore-scripts

      - name: Run prettier --check
        run: npm run format:check
