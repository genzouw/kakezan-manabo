name: format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    name: prettier --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # CI は最新の安定版（26 系）に追従する（Renovate が更新する）。
          # 最低要件は package.json の engines（>=24.0.0）で、24 系は CI では検証していない。
          # @commitlint/* が >=22.12.0、ESLint v10 が ^20.19.0 || ^22.13.0 || >=24 を要求するが、
          # 26 系はどちらも満たす。
          node-version: '26.13'
          cache: 'npm'

      - name: Install dependencies
        # フォーマット検査は postinstall を必要としない
        run: npm ci --ignore-scripts

      - name: Run prettier --check
        run: npm run format:check
