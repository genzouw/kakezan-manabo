name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: genzouw-static-content
  S3_PREFIX: kakezan
  CLOUDFRONT_DISTRIBUTION_ID: E6OM0XCJX1HGU

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC で AWS ロールを引き受けるために必要
      contents: read

    # 本リポジトリは公開されているため、本番デプロイは GitHub Environment 経由に
    # 限定している。この宣言があると OIDC トークンの subject が
    #
    #   repo:genzouw/kakezan-manabo:environment:production
    #
    # となり、AWS 側の信頼ポリシーがこの形だけを許可している。environment を
    # 宣言しないワークフローや main 以外のブランチからのワークフローは、
    # デプロイ用ロールを引き受けられない (production 環境のデプロイ可能ブランチを
    # main に限定しているため)。
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 配信するものだけを集める。
      #
      # 以前はリポジトリ全体を sync し、CI 設定などを --exclude で落としていたが、
      # 除外の書き忘れがそのまま公開に直結する (拒否リストの失敗モード)。実際に
      # .prettierrc や .husky/ が配信されていた。配信するファイルを明示して集める
      # 方式なら、新しく増えたファイルは既定で公開されない。
      - name: Collect publishable files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html style.css correct.mp3 incorrect.mp3 dist/
          cp -R js dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # dist/ に無いものは S3 からも消える (--delete)。過去に誤って公開された
      # ファイルもこれで取り除かれる。
      #
      # HTML だけは別扱いにしたいので、1 回目は --exclude "*.html" で長期キャッシュ、
      # 2 回目に HTML をキャッシュ無しで上げる。--exclude した対象は --delete の
      # 判定からも外れるため、1 回目で HTML が消えることはない。
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "*.html"

          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate" \
            --exclude "*" \
            --include "*.html"

      # 配信元の S3 バケットと CloudFront distribution は他のサブドメインと共有して
      # いるため、自分のプレフィックス配下だけを対象にする。
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/${S3_PREFIX}/*"
